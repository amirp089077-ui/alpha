name: alpha_vpn
description: ALPHA VPN - Free, Fast & Secure Internet
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Storage
  shared_preferences: ^2.3.3

  # Persian/Shamsi date
  shamsi_date: ^1.1.1

  # URL launcher
  url_launcher: ^6.3.1

  # Animations
  flutter_animate: ^4.5.0

  # Shimmer loading
  shimmer: ^3.0.0

  # SVG support
  flutter_svg: ^2.0.10+1

  # Intl
  intl: ^0.20.3

  # HTTP client
  http: ^1.2.2

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # VPN — VLESS/VMess/Trojan via V2Ray/Xray core
  # از GitHub مستقیم برای Xray 25.3.6 + xhttp support
  flutter_v2ray:
    git:
      url: https://github.com/blueboy-tm/flutter_v2ray.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/

  fonts:
    - family: IranSans
      fonts:
        - asset: assets/fonts/IranSans-Bold.ttf
          weight: 400
        - asset: assets/fonts/IranSans-Bold.ttf
          weight: 500
        - asset: assets/fonts/IranSans-Bold.ttf
          weight: 600
        - asset: assets/fonts/IranSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/IranSans-Bold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
