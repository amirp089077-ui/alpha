name: alpha_vpn
description: ALPHA VPN - Free, Fast & Secure Internet
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Storage
  shared_preferences: ^2.3.3

  # Persian/Shamsi date
  shamsi_date: ^1.1.1

  # URL launcher
  url_launcher: ^6.3.1

  # Animations
  flutter_animate: ^4.5.0

  # Shimmer loading
  shimmer: ^3.0.0

  # SVG support
  flutter_svg: ^2.0.10+1

  # Intl
  intl: ^0.20.3

  # HTTP client
  http: ^1.2.2

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # VPN — VLESS/VMess/Trojan via V2Ray core
  flutter_v2ray: ^1.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: IranSans
      fonts:
        - asset: assets/fonts/IranSans-Bold.ttf
          weight: 700
